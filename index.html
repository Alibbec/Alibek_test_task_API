<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GREEN API Test Task</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

    <div class="container">
        <!-- Левая колонка -->
        <div class="left-column">
            <div class="section">
                <input type="text" id="idInstance" placeholder="idInstance">
                <input type="text" id="apiToken" placeholder="apiTokenInstance">
            </div>

            <div class="section">
                <button id="getSettingsBtn">getSettings</button>
                <button id="getStateInstanceBtn">getStateInstance</button>
            </div>

            <div class="section">
                <input type="text" id="phoneNumber" placeholder="77771234567">
                <textarea id="message" placeholder="Hello World!"></textarea>
                <button id="sendMessageBtn">sendMessage</button>
            </div>

            <div class="section">
                <input type="text" id="filePhoneNumber" placeholder="77771234567">
                <input type="text" id="fileUrl" placeholder="https://my.site.com/img/horse.png">
                <button id="sendFileBtn">sendFileByUrl</button>
            </div>
        </div>

        <!-- Правая колонка -->
        <div class="right-column">
            <label for="response">Ответ:</label>
            <textarea id="response" readonly></textarea>
        </div>
    </div>

</body>
</html>
